name: Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Build ZIP
        id: build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            zip_path="$(scripts/package.sh "$TAG")"
          else
            zip_path="$(scripts/package.sh)"
          fi
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
          unzip -l "$zip_path"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: ${{ steps.build.outputs.zip }}

      - name: Attach ZIP to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "${{ steps.build.outputs.zip }}" --clobber
