name: Release

# Run "Release" from the Actions tab with the new version. It bumps the version, adds a CHANGELOG.md
# entry, tags v<version>, publishes a GitHub release and attaches the Chrome Web Store ZIP.
# A release created by hand on GitHub also gets the ZIP attached, as long as its tag matches the manifest.
# Once the Chrome Web Store secret and variables are set (see README.md), the "store" job also uploads the
# ZIP to the store and submits it for review. Without them it skips, and nothing reaches the store.

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version, such as 0.2.0 (one to four numbers, no "v")
        required: true
        type: string
      summary:
        description: Optional summary shown above the list of merged pull requests
        required: false
        type: string
      store:
        description: Upload to the Chrome Web Store and submit for review (only once the store settings are set)
        required: false
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_SUMMARY: ${{ inputs.summary }}
    steps:
      - name: Require the default branch
        if: github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "Run this workflow from $DEFAULT_BRANCH, not $GITHUB_REF_NAME." >&2
          exit 1

      # Check out the branch's latest commit rather than the one the run started on, so re-running
      # after main moved (which makes the push below fail) builds on top of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the version and tag
        id: version
        run: |
          version="$(node scripts/release.mjs version "$INPUT_VERSION")"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists. Pick a new version." >&2
            else
              echo "Tag $tag exists but has no GitHub release, probably because an earlier run failed after tagging." >&2
              echo "Create the release by hand from tag $tag on GitHub; this workflow then attaches the ZIP to it." >&2
            fi
            exit 1
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Write release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          args=(-f "tag_name=$TAG" -f "target_commitish=$(git rev-parse HEAD)")
          if [ -n "$PREVIOUS" ]; then
            args+=(-f "previous_tag_name=$PREVIOUS")
          fi
          {
            if [ -n "$INPUT_SUMMARY" ]; then
              printf '%s\n\n' "$INPUT_SUMMARY"
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Update versions and changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release.mjs prepare "$VERSION" "$(date -u +%F)" "$RUNNER_TEMP/notes.md"

      - name: Build ZIP
        id: build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          zip_path="$(scripts/package.sh "$TAG")"
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
          unzip -l "$zip_path"

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json package.json CHANGELOG.md
          git commit -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: ${{ steps.build.outputs.zip }}

      - name: Publish the GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: gh release create "$TAG" "$ZIP" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # A separate job so that a store failure leaves the GitHub release in place, and "Re-run failed jobs"
  # retries only the upload. It takes the ZIP from the release page, the same file you would upload by hand.
  store:
    needs: release
    if: github.event_name == 'workflow_dispatch' && inputs.store
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Upload to the Chrome Web Store and submit for review
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          CHROME_WEBSTORE_SERVICE_ACCOUNT: ${{ secrets.CHROME_WEBSTORE_SERVICE_ACCOUNT }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ vars.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ vars.CHROME_WEBSTORE_EXTENSION_ID }}
        run: |
          gh release download "$TAG" --pattern '*.zip' --dir "$RUNNER_TEMP/store"
          node scripts/publish-store.mjs "$RUNNER_TEMP"/store/*.zip

  # Releases created by hand on GitHub. Releases published by the job above don't trigger this,
  # because events caused by the workflow's own token don't start new runs.
  attach-zip:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # The release event's own commit (the tagged one).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build ZIP
        id: build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          zip_path="$(scripts/package.sh "$TAG")"
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
          unzip -l "$zip_path"

      - name: Attach the ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: gh release upload "$TAG" "$ZIP" --clobber
